name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (in addition to Artifact)'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag name (if publishing release)'
        type: string
        default: 'v2.42.1-custom'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust
        working-directory: host
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
          shared-key: desktop-macos-build

      - name: Build Native Helpers (Speech, Screen & DMG Background)
        run: |
          mkdir -p apps/desktop/build/native
          
          # 1. Build on-device speech helper
          swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos
          cp "$(swift build -c release --arch arm64 --arch x86_64 --package-path apps/desktop/native/speech-macos --show-bin-path)/codync-speech" \
            apps/desktop/build/native/codync-speech
          
          # 2. Generate Xcode project for CodyncScreen
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec apps/project.yml
          
          # 3. Generate DMG window background image
          swift packaging/dmg/background.swift apps/desktop/build/dmg-background.tiff

      # GitHub's release downloads answer 504 now and then. Fetch what the build downloads first, retrying, so the
      # build itself finds it cached: the Screen helper's Swift packages (WebRTC) and the computer-use driver.
      - name: Prefetch downloads (retrying)
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            xcodebuild -resolvePackageDependencies -project apps/Codync.xcodeproj -scheme Screen -derivedDataPath build/dd && break
            [ "$attempt" = 8 ] && exit 1
            echo "Swift packages didn't resolve; trying again"; sleep $((attempt * 30))
          done
          node packaging/cua-driver/fetch.mjs darwin "$RUNNER_TEMP/cua-driver"

      - name: Build and Package DMG
        working-directory: apps/desktop
        run: |
          npm ci
          npm run icons
          # Universal DMG signed ad hoc (identity "-"): no Apple certificate, but a valid signature, which macOS needs to
          # register Codync Screen's launch agent. Ad hoc needs hardened runtime off (Electron's frameworks carry another
          # team ID). No notarization, no auto-publish.
          # The steps of `npm run dist:mac:main`, with electron-builder retried: its downloads from GitHub releases
          # (Electron, its checksums, packaging tools) answer 504 now and then, and what one try fetched stays cached.
          node tools/account-config.mjs main
          node tools/native-host.mjs main
          node tools/native-screen.mjs main
          npx electron-vite build
          for attempt in 1 2 3 4 5; do
            # From the third try, download Electron and electron-builder's tools from npmmirror instead of GitHub.
            # Electron is still checked against the checksums the npm `electron` package ships (tools/electron-download.cjs).
            if [ "$attempt" -ge 3 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ ELECTRON_CUSTOM_DIR='{{ version }}'
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
            fi
            npx electron-builder --mac --config tools/main-builder.cjs -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false --publish never && break
            [ "$attempt" = 5 ] && exit 1
            echo "electron-builder failed; trying again"; rm -rf dist; sleep $((attempt * 60))
          done

      - name: Generate Homebrew Cask formula
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          # A tag names the version (v2.41.0-custom → 2.41.0-custom); a branch build uses the app's own.
          case "$TAG" in
            v*) CLEAN_VERSION="${TAG#v}" ;;
            *) CLEAN_VERSION=$(node -p "require('./apps/desktop/package.json').version") ;;
          esac
          cd apps/desktop/dist
          SHA=$(shasum -a 256 codync-macos.dmg | awk '{print $1}')
          echo "$SHA  codync-macos.dmg" > codync-macos.dmg.sha256
          sed -e "s|0\.0\.0|$CLEAN_VERSION|g" \
              -e "s|REPLACE_WITH_SHA256|$SHA|g" \
              -e "s|leepokai/Codync|${{ github.repository }}|g" \
              ../../../packaging/homebrew/codync.rb > codync.rb

      - name: Upload DMG and Cask Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codync-macos-dmg
          path: |
            apps/desktop/dist/codync-macos.dmg
            apps/desktop/dist/codync-macos.dmg.sha256
            apps/desktop/dist/codync.rb
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_release) || startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          cd apps/desktop/dist
          FILES=(codync-macos.dmg codync-macos.dmg.sha256 codync.rb)
          # `gh release create` has no --clobber: re-running with the same tag replaces the files
          # of the existing release instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "${{ github.sha }}" \
              --title "Codync Custom ($TAG)" \
              --notes "Custom build generated by GitHub Actions for commit ${{ github.sha }}."
          fi
